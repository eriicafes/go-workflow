name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      dynamodb:
        image: amazon/dynamodb-local:3.3.1
        ports:
          - 8000:8000
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      DYNAMODB_ENDPOINT: http://localhost:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Vet
        run: go vet ./...
      - name: Wait for backing services
        run: |
          for endpoint in localhost:8000; do
            for attempt in $(seq 1 30); do
              if curl -s -o /dev/null "http://$endpoint"; then break; fi
              sleep 2
            done
          done
      - name: Run tests
        run: go test -race ./...

  test-js:
    name: Test JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build

  world-testing:
    name: World Testing (${{ matrix.world }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        world: [testworld, local, postgres]
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HARNESS_WORLD: ${{ matrix.world }}
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - run: npm ci
      - name: Run the Workflow SDK's World test suite
        run: npm run test:world-testing

  release:
    name: Version Releases
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    needs: [test, test-js, world-testing]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - run: npm ci

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: npm run release
        env:
          NPM_CONFIG_PROVENANCE: true
