name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      dynamodb:
        image: amazon/dynamodb-local:3.3.1
        ports:
          - 8000:8000
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      DYNAMODB_ENDPOINT: http://localhost:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Vet
        run: go vet ./...
      - name: Wait for backing services
        run: |
          for endpoint in localhost:8000; do
            for attempt in $(seq 1 30); do
              if curl -s -o /dev/null "http://$endpoint"; then break; fi
              sleep 2
            done
          done
      - name: Run tests
        run: go test -race ./...

  test-js:
    name: Test JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build

  world-testing:
    name: World Testing (${{ matrix.world }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        world: [testworld, local, postgres, aws]
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # DynamoDB Local and ElasticMQ, an SQS stand-in, back the AWS World. An
      # empty image skips the service for the other Worlds.
      dynamodb:
        image: ${{ matrix.world == 'aws' && 'amazon/dynamodb-local:3.3.1' || '' }}
        ports:
          - 8000:8000
      elasticmq:
        image: ${{ matrix.world == 'aws' && 'softwaremill/elasticmq-native:1.7.1' || '' }}
        ports:
          - 9324:9324
    env:
      HARNESS_WORLD: ${{ matrix.world }}
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - run: npm ci
      - name: Run the Workflow SDK's World test suite
        run: npm run test:world-testing

  sdk-e2e:
    name: SDK E2E (${{ matrix.world }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        world: [testworld, local, postgres, aws]
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # DynamoDB Local and ElasticMQ, an SQS stand-in, back the AWS World. An
      # empty image skips the service for the other Worlds.
      dynamodb:
        image: ${{ matrix.world == 'aws' && 'amazon/dynamodb-local:3.3.1' || '' }}
        ports:
          - 8000:8000
      elasticmq:
        image: ${{ matrix.world == 'aws' && 'softwaremill/elasticmq-native:1.7.1' || '' }}
        ports:
          - 9324:9324
    # The SDK is checked out beside this repository, not inside it, so its
    # packages never resolve to the published ones in this repository's
    # node_modules.
    defaults:
      run:
        working-directory: go-workflow
    env:
      HARNESS_WORLD: ${{ matrix.world }}
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      SDK_DIR: ${{ github.workspace }}/sdk
      # The vercel/workflow commit whose e2e suite and workbench app run.
      SDK_COMMIT: &sdk-commit f717314b6fa8e91d653f56f90b9a1facf36a5f38
    steps:
      - uses: actions/checkout@v7
        with:
          path: go-workflow
      - uses: actions/checkout@v7
        with:
          repository: vercel/workflow
          ref: ${{ env.SDK_COMMIT }}
          path: sdk
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: go-workflow/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdk/package.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            sdk/target
          key: sdk-cargo-${{ env.SDK_COMMIT }}
      - run: npm ci
      - name: Build the Workflow SDK's workbench app
        run: world-http/tests/sdk-e2e/sdk-e2e.sh prepare
      - name: Run the Workflow SDK's e2e suite
        run: npm run test:sdk-e2e
      - name: Run the Workflow SDK's e2e suite on the Go fixtures
        run: npm run test:sdk-e2e
        env:
          SDK_APP: go

  # The Vercel World runs on Vercel's workflow backend, with the variables the
  # Workflow SDK's tests use, which the vercel environment holds. Its job runs
  # in this repository only, never for a fork or a pull request from one, and
  # the environment's protection rules decide which runs may use them. The Go
  # live tests run first, so a backend that refuses the project fails the job
  # in a minute, before the suites wait out their timeouts.
  vercel:
    name: Vercel World
    if: ${{ github.repository == 'eriicafes/go-workflow' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: vercel
    defaults:
      run:
        working-directory: go-workflow
    env:
      HARNESS_WORLD: vercel
      SDK_DIR: ${{ github.workspace }}/sdk
      SDK_COMMIT: *sdk-commit
      WORKFLOW_VERCEL_AUTH_TOKEN: ${{ secrets.WORKFLOW_VERCEL_AUTH_TOKEN }}
      WORKFLOW_VERCEL_PROJECT: ${{ vars.WORKFLOW_VERCEL_PROJECT }}
      WORKFLOW_VERCEL_TEAM: ${{ vars.WORKFLOW_VERCEL_TEAM }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: go-workflow
      - uses: actions/checkout@v7
        with:
          repository: vercel/workflow
          ref: ${{ env.SDK_COMMIT }}
          path: sdk
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: go-workflow/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdk/package.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            sdk/target
          key: sdk-cargo-${{ env.SDK_COMMIT }}
      - name: Run the Vercel World's live tests
        run: go test ./worlds/vercel -run Live -count=1 -timeout 10m -v
      - run: npm ci
      - name: Run the Workflow SDK's World test suite
        run: npm run test:world-testing
      - name: Build the Workflow SDK's workbench app
        run: world-http/tests/sdk-e2e/sdk-e2e.sh prepare
      - name: Run the Workflow SDK's e2e suite
        run: npm run test:sdk-e2e
      - name: Run the Workflow SDK's e2e suite on the Go fixtures
        run: npm run test:sdk-e2e
        env:
          SDK_APP: go

  # Every test of the Workflow SDK packages go-workflow mirrors is ported to
  # a Go test that names it, or skipped with a reason, in internal/sdkdrift.
  sdk-drift:
    name: SDK Drift
    runs-on: ubuntu-latest
    env:
      SDK_COMMIT: *sdk-commit
      SDK_DIR: ${{ github.workspace }}/sdk
    steps:
      - uses: actions/checkout@v7
        with:
          path: go-workflow
      - uses: actions/checkout@v7
        with:
          repository: vercel/workflow
          ref: ${{ env.SDK_COMMIT }}
          path: sdk
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: go-workflow/go.sum
      - name: Check every SDK test is ported or skipped
        working-directory: go-workflow
        run: go test ./internal/sdkdrift/ -run TestSDKTestsAreAccountedFor -count=1 -v

  release:
    name: Version Releases
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    needs: [test, test-js, world-testing, sdk-e2e, sdk-drift]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - run: npm ci

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: npm run release
        env:
          NPM_CONFIG_PROVENANCE: true
